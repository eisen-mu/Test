<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>学而时习之 · 识错</title>
<style>
:root{--bg:#f5f7f4;--panel:#fff;--ink:#263830;--muted:#849189;--line:#e5ebe6;--green:#32664f;--dark:#214b3b;--pale:#eaf2ec;--sage:#91aa98;--gold:#b88b55;--red:#b76557;--shadow:0 12px 32px rgba(34,63,50,.055);--radius:18px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 Inter,"PingFang SC","Microsoft YaHei",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}
.app{min-height:100vh;display:grid;grid-template-columns:220px 1fr}.sidebar{background:#fff;border-right:1px solid var(--line);padding:25px 16px;display:flex;flex-direction:column}.brand{display:flex;gap:11px;align-items:center;padding:0 12px 34px}.mark{width:38px;height:38px;border-radius:13px;background:var(--dark);color:white;display:grid;place-items:center;font:22px Georgia}.brand b{font:700 17px Georgia}.brand small{display:block;color:#93a099;font-size:10px;letter-spacing:.12em}.navlabel{padding:0 13px 9px;color:#a1aaa5;font-size:10px;letter-spacing:.14em}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;text-align:left;padding:11px 13px;border-radius:11px;color:#65756b;font-size:13px}.nav button.active{background:#edf4ee;color:#28533e;font-weight:650}.count{float:right;color:#9aa79e;font-size:11px}.spacer{flex:1}.side-note{margin:18px 4px 18px;padding:13px;background:#f6f8f5;border-radius:12px;color:#829087;font-size:11px;line-height:1.7}.side-note b{display:block;color:#496252;font-size:12px;margin-bottom:4px}
.main{min-width:0}.topbar{height:62px;background:#ffffffd9;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px;color:#89958d;font-size:12px}.topbar strong{color:#415b4b}.top-actions{display:flex;gap:9px;align-items:center}.top-tag{background:#f0f4f0;border-radius:20px;padding:6px 10px;font-size:10px;color:#6e8173}
.content{max-width:1240px;margin:auto;padding:34px 38px 55px}.head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:24px}.eyebrow{font-size:10px;letter-spacing:.18em;color:#98a69c;margin-bottom:8px}.head h1{font:600 30px Georgia,"Songti SC",serif;margin:0;color:#294536}.desc{margin:8px 0 0;color:#8a978e;font-size:12px}.toolbar,.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}.toolbar{padding:18px 20px;margin-bottom:18px}.toolbar-label{font-size:13px;font-weight:650;color:#476151;margin-bottom:13px}.toolbar-controls{display:grid;grid-template-columns:190px minmax(240px,1fr) auto;gap:12px;align-items:end}.toolbar-field{display:grid;gap:6px;color:#87948b;font-size:11px}.toolbar-field select,.toolbar-field input{height:38px;border:1px solid #e2e9e3;border-radius:9px;background:#fbfcfa;padding:0 11px;color:#42574a;outline:none}.toolbar-field input:focus,.toolbar-field select:focus{border-color:#9db6a2}.filter-hint{font-size:11px;color:#9aa59d;padding-bottom:10px}
.list-panel{padding:20px}.list-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.panel-title{font:600 17px Georgia,"Songti SC",serif;color:#34513e}.muted{color:#9aa59e;font-size:11px}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.wrong-card{border:1px solid #e8ede8;border-radius:14px;padding:15px 16px;background:#fff;transition:.15s;cursor:pointer}.wrong-card:hover{border-color:#b6c9b9;box-shadow:0 6px 18px #294e3d0c;transform:translateY(-1px)}.card-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px}.tag{display:inline-flex;padding:4px 8px;border-radius:20px;font-size:10px;background:#edf4ee;color:#4d7057}.tag.poetry{background:#f2f1e9;color:#8b7952}.tag.article{background:#edf2f5;color:#587387}.tag.book{background:#f2eef5;color:#80668b}.wrong-mark{font-size:10px;color:#b16e5e;background:#fbf1ed;padding:4px 8px;border-radius:20px}.card-title{font:600 16px Georgia,"Songti SC",serif;margin:0 0 7px;color:#304a39}.card-content{font-size:12px;color:#68776d;line-height:1.8;margin:0 0 12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.card-foot{border-top:1px solid #f0f3ef;padding-top:10px;display:flex;justify-content:space-between;gap:10px;color:#9aa59d;font-size:10px}.streak{color:#8a7855}.empty{padding:60px 10px;text-align:center;color:#9aa59d;font-size:12px}.pagination{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:18px}.btn{border:1px solid #e0e8e1;background:#fff;color:#617469;border-radius:9px;padding:8px 12px;font-size:11px}.btn:hover{border-color:#a9c0ad;color:#345d43}.btn:disabled{opacity:.4;cursor:not-allowed}.btn.primary{background:var(--dark);color:#fff;border-color:var(--dark)}.btn.danger{color:#a65e51;border-color:#ead7d2;background:#fff9f7}.btn.soft{background:#edf4ee;color:#42634b;border-color:#e2ebe3}.page-indicator{font-size:11px;color:#87958c}.jump-page{font-size:11px;color:#8b988f}.jump-page input{width:42px;height:30px;border:1px solid var(--line);border-radius:7px;text-align:center;margin:0 4px}
.modal{position:fixed;inset:0;background:#1e332866;z-index:40;display:none;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.dialog{background:#fff;border-radius:20px;width:min(760px,100%);max-height:92vh;overflow:auto;box-shadow:0 24px 70px #1c302b35;padding:24px}.dialog-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.dialog-head h2{font:600 19px Georgia,"Songti SC",serif;margin:0;color:#304b39}.close{border:0;background:#f2f5f2;border-radius:50%;width:32px;height:32px;color:#718077;font-size:18px}.review-face{background:linear-gradient(145deg,#f8faf7,#eef3ef);border:1px solid #e7eee8;border-radius:17px;padding:34px 42px;min-height:280px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.review-face .card-title{font-size:23px;margin:12px 0 18px}.review-body{font:17px/2 "Songti SC","Noto Serif CJK SC",serif;color:#344b3b;white-space:pre-wrap}.answer-box{margin-top:18px;padding:16px 20px;border-radius:12px;background:#fff;border:1px solid #e6ece6;text-align:left;width:100%;color:#53665a;font-size:13px;line-height:1.8}.review-meta{margin-top:13px;color:#99a49c;font-size:11px}.review-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:18px}.streak-bar{display:flex;align-items:center;justify-content:center;gap:7px;margin:17px 0 4px;color:#829087;font-size:11px}.dot{width:8px;height:8px;border-radius:50%;background:#e3e9e4}.dot.done{background:#5c8767}.detail-tools{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:18px;padding-top:15px;border-top:1px solid #edf1ed}.detail-tools .left,.detail-tools .right{display:flex;gap:8px;flex-wrap:wrap}
.edit-grid{display:grid;gap:12px}.edit-grid label{display:grid;gap:6px;font-size:11px;color:#829087}.edit-grid input,.edit-grid textarea{border:1px solid var(--line);border-radius:9px;padding:10px;color:#405548}.edit-grid textarea{min-height:120px;resize:vertical}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#294e3d;color:#fff;padding:10px 16px;border-radius:10px;font-size:12px;opacity:0;pointer-events:none;transition:.2s;z-index:70}.toast.show{opacity:1}
@media(max-width:900px){.app{grid-template-columns:180px 1fr}.content{padding:28px 22px}.cards{grid-template-columns:1fr}.toolbar-controls{grid-template-columns:1fr 1fr}.filter-hint{display:none}}
@media(max-width:650px){.app{grid-template-columns:1fr}.sidebar{display:none}.topbar{padding:0 16px}.content{padding:24px 14px}.toolbar-controls{grid-template-columns:1fr}.head h1{font-size:26px}.review-face{padding:25px 18px;min-height:240px}.review-body{font-size:15px}.detail-tools{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
 <div class="brand"><div class="mark">习</div><div><b>学而时习之</b><small>LEARN · REFLECT · REVIEW</small></div></div>
 <div class="navlabel">学习空间</div>
 <nav class="nav">
  <button>◫　知新 <span class="count">材料</span></button>
  <button>▤　卡片管理</button>
  <button>◷　温故</button>
  <button class="active">⌁　识错 <span class="count" id="navCount">8</span></button>
  <button>♡　打动我的一瞬</button>
 </nav>
 <div class="spacer"></div>
 <div class="side-note"><b>识错 · 使用提示</b>这里集中回顾曾经评为“没记住”的卡片。连续答对 3 次后，卡片自动恢复正常。</div>
 <div style="border-top:1px solid var(--line);padding:15px 8px 0;color:#839088;font-size:12px">●　本地原型演示</div>
</aside>
<main class="main">
 <header class="topbar"><div>学习空间　/　<strong>识错</strong></div><div class="top-actions"><span class="top-tag">本地数据演示</span></div></header>
 <div class="content">
  <div class="head"><div><div class="eyebrow">LEARN FROM MISTAKES</div><h1>识错</h1><p class="desc">把没记住的内容重新找回来，在一次次回顾中巩固记忆。</p></div></div>
  <div class="toolbar panel">
   <div class="toolbar-label">错题筛选</div>
   <div class="toolbar-controls">
    <label class="toolbar-field"><span>材料类型</span><select id="category"><option value="all">全部材料类型</option><option value="poetry">诗词</option><option value="article">文章</option><option value="book">书籍</option></select></label>
    <label class="toolbar-field"><span>材料名称 / 作者</span><input id="search" placeholder="输入材料名称或作者名…"></label>
   </div>
  </div>
  <section class="panel list-panel">
   <div class="list-head"><h2 class="panel-title" style="margin:0">待巩固内容 <span id="listCount" class="muted">8 张</span></h2><span class="muted" id="pageSummary">第 1 / 2 页</span></div>
   <div class="cards" id="cardList"></div><div class="empty" id="empty" hidden>当前没有符合条件的错题</div>
   <div class="pagination" id="pagination"><button class="btn" id="firstPage">首页</button><button class="btn" id="prevPage">上一页</button><span class="page-indicator" id="pageIndicator">1 / 2</span><button class="btn" id="nextPage">下一页</button><button class="btn" id="lastPage">末页</button><label class="jump-page">到 <input id="jumpPage" type="number" min="1" value="1"> 页</label><button class="btn" id="goPage">跳转</button></div>
  </section>
 </div>
</main>
</div>

<div class="modal" id="detailModal"><div class="dialog">
 <div class="dialog-head"><h2>错题卡片详情</h2><button class="close" id="closeDetail">×</button></div>
 <div class="review-face" id="reviewFace"></div>
 <div class="streak-bar" id="streakBar"></div>
  <div class="detail-tools"><div class="left"><button class="btn" id="viewSource">查看原文</button><button class="btn" id="favorite">♡ 收藏</button><button class="btn" id="editCard">编辑卡片</button></div><div class="right"><button class="btn danger" id="removeWrong">移出错题本</button></div></div>
</div></div>

<div class="modal" id="editModal"><div class="dialog" style="width:min(600px,100%)">
 <div class="dialog-head"><h2>编辑卡片</h2><button class="close" id="closeEdit">×</button></div>
 <div class="edit-grid"><label>标题<input id="editTitle"></label><label>卡片内容 / 问题<textarea id="editContent"></textarea></label><label>答案（逻辑卡）<textarea id="editAnswer"></textarea></label><label>个人备注<textarea id="editNote"></textarea></label></div>
 <div class="review-actions"><button class="btn" id="cancelEdit">取消</button><button class="btn primary" id="saveEdit">保存修改</button></div>
</div></div>





<div class="toast" id="toast"></div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const attr=s=>esc(s).replace(/`/g,'&#96;');
const categoryName={poetry:'诗词',article:'文章',book:'书籍'};
let cards=[
{id:1,category:'poetry',type:'poem',title:'春晓',content:'春眠不觉晓，处处闻啼鸟。夜来风雨声，花落知多少。',answer:'孟浩然《春晓》',material:'《唐诗三百首》',author:'孟浩然',location:'卷一 · 春晓',streak:1,note:'注意“晓”是清晨。',favorite:false},
{id:2,category:'book',type:'excerpt',title:'温故而知新',content:'温故而知新，可以为师矣。',answer:'复习旧知识时能有新的体会和发现，就可以凭借这一点成为老师。',material:'《论语》',author:'孔子',location:'第二章 · 为政',streak:0,note:'联系到学习中的迁移和再理解。',favorite:true},
{id:3,category:'article',type:'logic',title:'复利效应的关键条件',content:'复利效应成立需要哪些关键条件？',answer:'持续投入、时间积累，以及收益能够继续参与下一轮增长。',material:'《长期主义的力量》',author:'林间',location:'第三节 · 复利',streak:2,note:'不要只关注收益率。',favorite:false},
{id:4,category:'poetry',type:'poem',title:'登鹳雀楼',content:'白日依山尽，黄河入海流。欲穷千里目，更上一层楼。',answer:'王之涣《登鹳雀楼》',material:'《唐诗三百首》',author:'王之涣',location:'卷二 · 登鹳雀楼',streak:0,note:'',favorite:false},
{id:5,category:'book',type:'excerpt',title:'第一性原理',content:'从事物最基本的原理出发，重新审视问题，而不是简单类比已有经验。',answer:'从基本事实和基本原理出发拆解问题，再重新推导解决方案。',material:'《创新者的方法》',author:'—',location:'第一章 · 思考方法',streak:1,note:'遇到复杂问题时，先拆解假设。',favorite:false},
{id:6,category:'article',type:'logic',title:'注意力的稀缺性',content:'为什么信息越丰富，主动选择关注对象越重要？',answer:'注意力是有限资源，信息增加会提高筛选成本，因此需要主动分配注意力。',material:'《注意力经济》',author:'—',location:'第一节',streak:0,note:'',favorite:false},
{id:7,category:'poetry',type:'poem',title:'观书有感',content:'半亩方塘一鉴开，天光云影共徘徊。问渠那得清如许？为有源头活水来。',answer:'朱熹《观书有感》',material:'《朱子文集》',author:'朱熹',location:'观书有感',streak:2,note:'把学习比作源头活水。',favorite:false},
{id:8,category:'book',type:'excerpt',title:'刻意练习',content:'有效练习需要明确目标、及时反馈，并持续修正动作。',answer:'不是简单重复，而是在明确目标和反馈下不断修正。',material:'《刻意练习》',author:'安德斯·艾利克森',location:'第二章',streak:0,note:'',favorite:false}
];
let currentId=null,page=1,pageSize=6,editing=false;
function filtered(){let c=$('category').value,q=$('search').value.trim().toLowerCase();return cards.filter(x=>(c==='all'||x.category===c)&&(!q||(x.material+' '+x.author).toLowerCase().includes(q)))}
function render(){
 const a=filtered(),pages=Math.max(1,Math.ceil(a.length/pageSize));page=Math.min(page,pages);
 const rows=a.slice((page-1)*pageSize,page*pageSize);
 $('cardList').innerHTML=rows.map(x=>`<article class="wrong-card" data-id="${x.id}">
 <div class="card-top"><span class="tag ${x.category}">${categoryName[x.category]} · ${x.type==='logic'?'逻辑卡':x.type==='poem'?'诗词卡':'摘录卡'}</span><span class="wrong-mark">错题</span></div>
 <h3 class="card-title">${esc(x.title)}</h3><p class="card-content">${esc(x.content)}</p>
 <div class="card-foot"><span>${esc(x.material)} · ${esc(x.author)}</span><span class="streak">连续答对 ${x.streak}/3</span></div></article>`).join('');
 $('empty').hidden=!!a.length;$('listCount').textContent=a.length+' 张';$('navCount').textContent=cards.length;
 $('pageSummary').textContent=`第 ${page} / ${pages} 页`;$('pageIndicator').textContent=`${page} / ${pages}`;$('jumpPage').max=pages;$('jumpPage').value=page;
 $('pagination').style.display=a.length?'flex':'none';$('firstPage').disabled=$('prevPage').disabled=page===1;$('lastPage').disabled=$('nextPage').disabled=page===pages;
 document.querySelectorAll('.wrong-card').forEach(el=>el.onclick=()=>openDetail(+el.dataset.id));
}
function toast(msg){$('toast').textContent=msg;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1800)}
function openDetail(id){currentId=id;renderDetail();$('detailModal').classList.add('show')}
function current(){return cards.find(x=>x.id===currentId)}
function renderDetail(){
 const x=current();if(!x)return;
 $('reviewFace').innerHTML=`<span class="tag ${x.category}">${categoryName[x.category]} · ${x.type==='logic'?'逻辑卡':x.type==='poem'?'诗词卡':'摘录卡'}</span><h3 class="card-title">${esc(x.title)}</h3><div class="review-body">${esc(x.content)}</div>${x.type==='logic'?`<div class="answer-box"><b>答案</b><br>${esc(x.answer)}</div>`:''}<div class="review-meta">${esc(x.material)} · ${esc(x.author)} · ${esc(x.location)}</div>`;
 $('streakBar').innerHTML=`连续答对次数：<b>${x.streak}/3</b>`;
 $('favorite').textContent=x.favorite?'♥ 已收藏':'♡ 收藏';
}
function removeWrong(){const x=current();if(!x)return;if(!confirm('确定将这张卡片移出错题本并恢复为正常状态吗？连续答对次数将清零。'))return;cards=cards.filter(c=>c.id!==x.id);$('detailModal').classList.remove('show');toast('已移出错题本，卡片恢复正常');render()}
$('category').onchange=()=>{page=1;render()};$('search').oninput=()=>{page=1;render()};
$('firstPage').onclick=()=>{page=1;render()};$('prevPage').onclick=()=>{page--;render()};$('nextPage').onclick=()=>{page++;render()};$('lastPage').onclick=()=>{page=Math.ceil(filtered().length/pageSize);render()};$('goPage').onclick=()=>{let p=+ $('jumpPage').value;if(p>=1&&p<=Math.ceil(filtered().length/pageSize)){page=p;render()}else toast('请输入有效页码')};
$('closeDetail').onclick=()=>$('detailModal').classList.remove('show');$('detailModal').onclick=e=>{if(e.target===$('detailModal'))$('detailModal').classList.remove('show')};
$('removeWrong').onclick=removeWrong;
$('viewSource').onclick=()=>toast(current()?.material+' · '+current()?.location+'（原文定位为演示）');
$('favorite').onclick=()=>{let x=current();x.favorite=!x.favorite;renderDetail();toast(x.favorite?'已加入打动我的一瞬（演示）':'已取消收藏（演示）')};
$('editCard').onclick=()=>{let x=current();$('editTitle').value=x.title;$('editContent').value=x.content;$('editAnswer').value=x.answer;$('editNote').value=x.note;$('editModal').classList.add('show')};
function closeEdit(){$('editModal').classList.remove('show')}
$('closeEdit').onclick=$('cancelEdit').onclick=closeEdit;
$('saveEdit').onclick=()=>{let x=current();x.title=$('editTitle').value.trim();x.content=$('editContent').value.trim();x.answer=$('editAnswer').value.trim();x.note=$('editNote').value.trim();closeEdit();render();renderDetail();toast('卡片已保存（演示）')};
render();

</script>
</body></html>
